services:
  mfcbot:
    build: .
    user: 1001:1001
    entrypoint: ["/usr/bin/env", "sh", "/app/run.sh"]
    volumes:
      - ./mfcbot.db:/app/mfcbot.db
      - ./.env:/app/.env
      - /home/joeln/MFCBot/MFCDiscordBot/:/app/
      - ./run.sh:/app/run.sh
    ##restart: unless-stopped
    depends_on:
      - mfcgo


  mfcgo:
    image: mfcgo
    restart: unless-stopped